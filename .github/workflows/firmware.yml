name: ESP32 Firmware Build

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - sensor_node
          - control_node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board package
        shell: bash
        run: |
          set -e

          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

          for attempt in 1 2 3; do
            echo "ESP32 Core installation attempt $attempt/3"

            if arduino-cli core install esp32:esp32@3.2.1 \
              --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json; then
              echo "ESP32 Core installed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Installation failed. Retrying in 20 seconds..."
              sleep 20
            fi
          done

          echo "ESP32 Core installation failed after 3 attempts."
          exit 1

      - name: Install firmware libraries
        run: |
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "PubSubClient@2.8"
          arduino-cli lib install "DHT sensor library@1.4.6"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
          arduino-cli lib install "BH1750@1.3.0"
          arduino-cli lib install "Adafruit GFX Library@1.11.11"
          arduino-cli lib install "Adafruit SSD1306@2.5.13"

      - name: Prepare local firmware configuration
        shell: bash
        run: |
          cp "firmware/${{ matrix.node }}/Config.h.example" \
             "firmware/${{ matrix.node }}/Config.h"

      - name: Enable Sensor Node OTA compile path
        if: matrix.node == 'sensor_node'
        shell: bash
        run: |
          CONFIG="firmware/sensor_node/Config.h"

          sed -i 's/^#define OTA_ENABLED 0$/#define OTA_ENABLED 1/' "$CONFIG"

          cat >> "$CONFIG" <<'EOF'

          // CI-only test configuration. Never use these values in production.
          #include <stdint.h>

          static const uint8_t OTA_ED25519_PUBLIC_KEY[32] = {
            0xd7, 0x5a, 0x98, 0x01, 0x82, 0xb1, 0x0a, 0xb7,
            0xd5, 0x4b, 0xfe, 0xd3, 0xc9, 0x64, 0x07, 0x3a,
            0x0e, 0xe1, 0x72, 0xf3, 0xda, 0x62, 0x32, 0x5a,
            0xaf, 0x02, 0x1a, 0x68, 0xf7, 0x07, 0x51, 0x1a
          };

          #define OTA_ROOT_CA_CERT "CI_ONLY_DUMMY_CERTIFICATE"
          EOF

      - name: Compile ESP32 firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings all \
            "firmware/${{ matrix.node }}"
