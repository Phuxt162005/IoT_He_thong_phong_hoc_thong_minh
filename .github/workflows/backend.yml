name: Backend checks
on:
  push:
    branches: [main, 'feat/**', 'docs/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - run: npm test
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartclass_owner
          POSTGRES_PASSWORD: ci-test-owner-password
          POSTGRES_DB: smartclass_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartclass_owner -d smartclass_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_MIGRATION_DATABASE_URL: postgres://smartclass_owner:ci-test-owner-password@localhost:5432/smartclass_test
      TEST_DATABASE_URL: postgres://smartclass_app:ci-test-app-password@localhost:5432/smartclass_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create restricted test role
        run: psql "$TEST_MIGRATION_DATABASE_URL" -c "CREATE ROLE smartclass_app LOGIN PASSWORD 'ci-test-app-password';"
      - run: npm run test:integration
