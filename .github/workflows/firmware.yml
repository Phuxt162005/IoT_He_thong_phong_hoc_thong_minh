name: ESP32 Firmware Build

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - sensor_node
          - control_node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board package
        run: |
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.2.1 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install firmware libraries
        run: |
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "PubSubClient@2.8"
          arduino-cli lib install "DHT sensor library@1.4.6"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
          arduino-cli lib install "BH1750@1.3.0"
          arduino-cli lib install "Adafruit GFX Library@1.11.11"
          arduino-cli lib install "Adafruit SSD1306@2.5.13"

      - name: Prepare local firmware configuration
        shell: bash
        run: |
          cp "firmware/${{ matrix.node }}/Config.h.example" \
             "firmware/${{ matrix.node }}/Config.h"

      - name: Compile ESP32 firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings all \
            "firmware/${{ matrix.node }}"
